<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nodex</title>

    <link rel="stylesheet" href="/defaults.css">
    <link rel="stylesheet" href="/LOGIN/login.css">
    <link rel="icon" type="image/png" href="/res/Nodex_Logo.png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="base-container">
        <img src="/res/Nodex_Logo.png" alt="Nodex Logo" width="100" height="100">
        <h1 class="login-button">Get Started!</h1>

        <form id="register-form">
            <span>Email</span>
            <input type="email" id="email-input" name="user-email" placeholder="Email" required>
            <span>Password</span>
            <input type="password" id="password-input" name="user-password" placeholder="Password" required>
            <button type="submit">Register</button>
        </form>

        <span style="margin-top: 50px;">Already have an account?</span>
        <a href="/LOGIN/login.html">Login</a>
    </div>

    <script src="/REGISTER/register.js"></script>
</body>
</html>
